[project]
name = "private-gateway-web-backend"
version = "0.1.0"
description = "Private Gateway Web API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn[standard]==0.54.0", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.1.4", "asyncpg==0.32.0",
  "alembic==1.20.0", "argon2-cffi==25.1.0", "pyotp==2.10.0",
  "cryptography==50.0.2", "segno==1.6.6", "anyio==4.15.1",
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
