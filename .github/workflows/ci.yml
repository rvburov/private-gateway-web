name: Проверки приложения

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: pgweb
          POSTGRES_DB: pgweb_test
          # Только одноразовый сервис CI, не пароль приложения или сервера.
          POSTGRES_PASSWORD: pgweb-ci-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgweb -d pgweb_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGWEB_TEST_DATABASE_URL: postgresql+asyncpg://pgweb:pgweb-ci-only@127.0.0.1:5432/pgweb_test
      PGWEB_DATABASE_URL: postgresql+asyncpg://pgweb:pgweb-ci-only@127.0.0.1:5432/pgweb_test
      PGWEB_PUBLIC_ORIGIN: http://127.0.0.1:5173
      PGWEB_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - name: Одноразовые ключи процесса CI
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("PGWEB_SECRET_KEY=" + secrets.token_hex(32) + "\n")
              output.write("PGWEB_MASTER_KEYS=1:" + secrets.token_hex(32) + "\n")
          PY
      - run: python -m alembic upgrade head
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash -n scripts/*.sh deploy/*.sh deploy/backup/*.sh
      - run: scripts/dev.sh init
      - run: deploy/local.sh config
      - run: deploy/local.sh up
      - run: python3 deploy/smoke.py
      - name: Публичные страницы в браузере на двух языках
        run: node tests/browser-smoke.cjs
        env:
          PGWEB_BROWSER_URL: http://127.0.0.1:8080
      - name: Остановить только стенд этой проверки
        if: always()
        run: deploy/local.sh down

  # Рабочий стек как на сервере AI Agent Capper: пользователь deploy, общий вход Caddy capper
  # (имитация tests/deploy/front), server-setup.sh, deploy.sh, HTTPS, IP посетителя за двумя
  # Caddy, бэкап и проверка восстановления, повторный деплой и ограничение ключа CI
  production:
    name: Рабочий стек за общим входом
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Полная история: коммит передается в отдельный репозиторий как master
          fetch-depth: 0
      - name: Синтаксис и shellcheck скриптов сервера
        run: |
          bash -n deploy/*.sh deploy/backup/*.sh tests/deploy/*.sh
          shellcheck -x -P deploy/backup deploy/deploy.sh deploy/server-setup.sh deploy/import-release.sh deploy/backup/*.sh tests/deploy/login-probe.sh
      - name: Сервер как у AI Agent Capper (пользователь deploy, ключи бэкапа capper)
        run: |
          sudo apt-get install -y -qq age > /dev/null
          sudo useradd --create-home --shell /bin/bash --groups docker deploy
          keys="$(age-keygen 2>&1)"
          pub="$(printf '%s\n' "$keys" | sed -n 's/.*public key: \(age1[0-9a-z]*\).*/\1/p' | head -n1)"
          sec="$(printf '%s\n' "$keys" | grep -o 'AGE-SECRET-KEY-1[0-9A-Z]*' | head -n1)"
          test -n "$pub" && test -n "$sec"
          sudo install -d -m 755 /opt/ai_agent_capper/deploy
          printf 'CAPPER_DOMAIN=capper.localhost\nBACKUP_AGE_RECIPIENTS=%s\nBACKUP_AGE_IDENTITY=%s\n' "$pub" "$sec" \
            | sudo tee /opt/ai_agent_capper/deploy/.env > /dev/null
          sudo chmod 600 /opt/ai_agent_capper/deploy/.env
          echo "127.0.0.1 pgweb.localhost capper.localhost" | sudo tee -a /etc/hosts > /dev/null
          # Репозиторий для server-setup.sh: проверяемый коммит как master
          git init --quiet --bare /tmp/pgweb.git
          git push --quiet /tmp/pgweb.git HEAD:refs/heads/master
          sudo chown -R deploy:deploy /tmp/pgweb.git
          ssh-keygen -q -t ed25519 -N "" -C ci-deploy -f /tmp/ci_key
      - name: Общий вход (имитация Caddy AI Agent Capper)
        run: docker compose -f tests/deploy/front/compose.yml up -d --build --wait
      - name: server-setup.sh
        run: |
          sudo bash deploy/server-setup.sh --domain pgweb.localhost --repo /tmp/pgweb.git \
            --ci-key "$(cat /tmp/ci_key.pub)"
          env_file=/opt/private-gateway-web/deploy/.env
          test "$(sudo stat -c '%a %U' "$env_file")" = "600 deploy"
          sudo grep -q '^BACKUP_AGE_RECIPIENTS=age1' "$env_file"
          sudo grep -q '^BACKUP_S3_PREFIX=private-gateway-web$' "$env_file"
          test "$(stat -c %U /opt/ai_agent_capper/deploy/caddy-sites)" = deploy
          sudo grep -q '^command="bash /opt/private-gateway-web/deploy/deploy.sh --ssh",restrict ssh-ed25519 ' \
            /home/deploy/.ssh/authorized_keys
          # Повторный запуск ничего не перезаписывает
          before="$(sudo sha256sum "$env_file")"
          sudo bash deploy/server-setup.sh --repo /tmp/pgweb.git > /dev/null
          test "$before" = "$(sudo sha256sum "$env_file")"
          # Проверочный сертификат Caddy для pgweb.localhost — не от Let's Encrypt
          echo 'PGWEB_HEALTH_INSECURE=1' | sudo tee -a "$env_file" > /dev/null
      - name: Первый деплой
        run: sudo -iu deploy bash /opt/private-gateway-web/deploy/deploy.sh --no-fetch
      - name: Проверки через общий вход по HTTPS
        run: python3 deploy/smoke.py
        env:
          PGWEB_SMOKE_ORIGIN: https://pgweb.localhost
          PGWEB_SMOKE_INSECURE: "1"
      - name: IP посетителя за двумя Caddy
        run: |
          host="$(tests/deploy/login-probe.sh https://pgweb.localhost 6)"
          echo "этот компьютер, подмененный X-Forwarded-For:$host"
          [ "${host##* }" = 429 ]
          front="$(docker inspect --format '{{(index .NetworkSettings.Networks "capper_edge").IPAddress}}' capper-caddy-1)"
          other="$(docker run --rm --network capper_edge -v "$PWD/tests/deploy/login-probe.sh:/p.sh:ro" \
            --entrypoint sh curlimages/curl:8.17.0 /p.sh https://pgweb.localhost 1 \
            --resolve "pgweb.localhost:443:$front")"
          echo "другой посетитель:$other"
          [ "${other# }" = 401 ]
      - name: Администратор, бэкап и проверка восстановления
        working-directory: /opt/private-gateway-web/deploy
        run: |
          printf '%s\n' "ci-$(openssl rand -hex 16)" | sudo -u deploy docker compose run --rm -T cli \
            bootstrap-admin --email owner@example.test --name CI --password-stdin
          sudo -u deploy docker compose exec -T backup backup.sh
          sudo -u deploy docker compose exec -T backup restore-check.sh
          sudo -u deploy docker compose exec -T backup restore.sh --list
      - name: Прием выпуска клиента (ключ import-release.sh)
        run: |
          cmd=(bash /opt/private-gateway-web/deploy/import-release.sh --ssh)
          head -c 300000 /dev/urandom > /tmp/PrivateGateway-1.2.3-win-x64.msi
          sha="$(sha256sum /tmp/PrivateGateway-1.2.3-win-x64.msi | cut -d' ' -f1)"
          sudo -u deploy env SSH_ORIGINAL_COMMAND="import windows 1.2.3 PrivateGateway-1.2.3-win-x64.msi $sha" \
            "${cmd[@]}" < /tmp/PrivateGateway-1.2.3-win-x64.msi
          row="$(cd /opt/private-gateway-web/deploy && sudo -u deploy docker compose exec -T postgres \
            psql -U pgweb -d pgweb -tAc "select platform, version, sha256 from releases")"
          test "$row" = "windows|1.2.3|$sha"
          test -z "$(sudo ls -A /opt/private-gateway-web/deploy/imports)"
          # Поврежденный файл, бета, путь в имени и чужая команда не принимаются
          if echo broken | sudo -u deploy env SSH_ORIGINAL_COMMAND="import windows 1.2.4 a.msi $sha" "${cmd[@]}"; then exit 1; fi
          if sudo -u deploy env SSH_ORIGINAL_COMMAND="import windows 1.3.0-beta a.msi $sha" "${cmd[@]}" < /dev/null; then exit 1; fi
          if sudo -u deploy env SSH_ORIGINAL_COMMAND="import windows 1.2.4 ../x $sha" "${cmd[@]}" < /dev/null; then exit 1; fi
          if sudo -u deploy env SSH_ORIGINAL_COMMAND="rm -rf /" "${cmd[@]}" < /dev/null; then exit 1; fi
          row="$(cd /opt/private-gateway-web/deploy && sudo -u deploy docker compose exec -T postgres \
            psql -U pgweb -d pgweb -tAc "select version from releases where platform = 'windows'")"
          test "$row" = 1.2.3
      # Порядок workflow клиента: установщики (import, шаг выше), rpm (asset), подпись, манифест
      - name: Лента обновлений клиента (asset, update-sig, update)
        run: |
          cmd=(bash /opt/private-gateway-web/deploy/import-release.sh --ssh)
          imports=/opt/private-gateway-web/deploy/imports
          send() { sudo -u deploy env SSH_ORIGINAL_COMMAND="$1" "${cmd[@]}" < "$2"; }
          sql() {
            (cd /opt/private-gateway-web/deploy && sudo -u deploy docker compose exec -T postgres \
              psql -U pgweb -d pgweb -tAc "$1")
          }
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          # Манифест как у scripts/release.cs клиента: доля раскатки, затем файлы вида kind=путь
          manifest() {
            python3 - "$@" <<'PY'
          import hashlib, json, os, sys
          assets = {}
          for item in sys.argv[2:]:
              kind, path = item.split("=", 1)
              data = open(path, "rb").read()
              digest = hashlib.sha256(data).hexdigest()
              assets[kind] = {"file": os.path.basename(path), "sha256": digest, "size": len(data)}
          print(json.dumps({"version": "1.2.3", "channel": "stable", "rollout": int(sys.argv[1]),
                            "published": "2026-11-13T12:00:00Z",
                            "notes": "https://pgweb.localhost/downloads",
                            "highlights": ["Проверка ленты обновлений."], "assets": assets},
                           indent=2, ensure_ascii=False))
          PY
          }
          signature() { head -c 70 /dev/urandom | base64 -w0 > "$1"; echo >> "$1"; }
          msi=/tmp/PrivateGateway-1.2.3-win-x64.msi
          rpm=/tmp/private-gateway-1.2.3-1.x86_64.rpm
          deb=/tmp/private-gateway_1.2.3_amd64.deb
          head -c 200000 /dev/urandom > "$rpm"
          head -c 100000 /dev/urandom > "$deb"
          sig=/tmp/update.json.sig
          # rpm — только в хранилище, строки каталога нет
          send "asset 1.2.3 ${rpm##*/} $(sum "$rpm")" "$rpm"
          test "$(sql "select count(*) from releases")" = 1
          manifest 20 win-x64-msi="$msi" linux-x64-rpm="$rpm" > /tmp/update.json
          signature "$sig"
          send "update-sig 1.2.3 update.json.sig $(sum "$sig")" "$sig"
          send "update 1.2.3 update.json $(sum /tmp/update.json)" /tmp/update.json
          row="$(sql "select version, channel, rollout, encode(sha256(manifest), 'hex'), signature from app_updates")"
          test "$row" = "1.2.3|stable|20|$(sum /tmp/update.json)|$(tr -d '\n' < "$sig")"
          test -z "$(sudo ls -A "$imports")"
          # Раскатка: та же версия с новой долей и подписью заменяет строку
          manifest 50 win-x64-msi="$msi" linux-x64-rpm="$rpm" > /tmp/update.json
          signature "$sig"
          send "update-sig 1.2.3 update.json.sig $(sum "$sig")" "$sig"
          send "update 1.2.3 update.json $(sum /tmp/update.json)" /tmp/update.json
          test "$(sql "select count(*), max(rollout), max(signature) from app_updates")" = "1|50|$(tr -d '\n' < "$sig")"
          # Отказы: deb нет на сайте; SHA не тот; подписи нет, она израсходована или старше часа;
          # бета, путь в имени, чужое имя подписи, лишнее слово
          manifest 100 win-x64-msi="$msi" linux-x64-deb="$deb" > /tmp/missing.json
          send "update-sig 1.2.3 update.json.sig $(sum "$sig")" "$sig"
          if send "update 1.2.3 update.json $(sum /tmp/missing.json)" /tmp/missing.json; then exit 1; fi
          send "update-sig 1.2.3 update.json.sig $(sum "$sig")" "$sig"
          if send "update 1.2.3 update.json $(sum "$msi")" /tmp/update.json; then exit 1; fi
          if send "update 1.2.3 update.json $(sum /tmp/update.json)" /tmp/update.json; then exit 1; fi
          send "update-sig 1.2.3 update.json.sig $(sum "$sig")" "$sig"
          sudo -u deploy touch -d '2 hours ago' "$imports/.update-1.2.3.json.sig"
          if send "update 1.2.3 update.json $(sum /tmp/update.json)" /tmp/update.json; then exit 1; fi
          if send "update-sig 1.2.3 update.json.sig $(sum "$msi")" "$sig"; then exit 1; fi
          if send "asset 1.2.3 ${rpm##*/} $(sum "$msi")" "$rpm"; then exit 1; fi
          if send "asset 1.3.0-beta.1 ${rpm##*/} $(sum "$rpm")" "$rpm"; then exit 1; fi
          if send "asset 1.2.3 ../${rpm##*/} $(sum "$rpm")" "$rpm"; then exit 1; fi
          if send "update-sig 1.2.3 other.sig $(sum "$sig")" "$sig"; then exit 1; fi
          if send "update 1.2.3 update.json $(sum /tmp/update.json) extra" /tmp/update.json; then exit 1; fi
          test "$(sql "select rollout from app_updates")" = 50
          test -z "$(sudo ls -A "$imports")"
      - name: Повторный деплой и ограничение ключа CI
        run: |
          sudo -iu deploy bash /opt/private-gateway-web/deploy/deploy.sh --no-fetch --no-pull | tee /tmp/redeploy.log
          grep -q 'сохранены с тегом previous' /tmp/redeploy.log
          grep -q 'файл сайта для общего входа не изменился' /tmp/redeploy.log
          grep -q 'копия базы перед миграциями' /tmp/redeploy.log
          if sudo -u deploy env SSH_ORIGINAL_COMMAND='rm -rf /' bash /opt/private-gateway-web/deploy/deploy.sh --ssh; then
            echo 'ключ CI выполнил не команду deploy' >&2
            exit 1
          fi
      - name: Состояние и логи
        if: failure()
        run: |
          (cd /opt/private-gateway-web/deploy && sudo -u deploy docker compose ps -a && sudo -u deploy docker compose logs --no-color --tail=150) || true
          docker compose -f tests/deploy/front/compose.yml logs --no-color --tail=100 || true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Закрепленный gitleaks с проверкой архива
        run: |
          tool_dir="$(mktemp -d)"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' checksums.txt > selected.sha256 && test -s selected.sha256 && sha256sum -c selected.sha256 && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          "$tool_dir/gitleaks" dir . --redact --no-banner
